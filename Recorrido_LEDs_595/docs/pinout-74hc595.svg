<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="Vista superior del 74HC595 en encapsulado DIP-16 con el capacitor de desacoplo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .lbl  { font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #16191C; }
    .lbl2 { font: 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #5C666E; }
    .wl   { font: 500 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .chip { font: 600 12.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #16191C; }
    .ttl  { font: 600 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #16191C; }
    .w    { fill: none; stroke-width: 2; stroke-linecap: square; }
  </style>

  <rect x="0" y="0" width="720" height="400" fill="#FBFBF9"/>
  <text x="20" y="28" class="ttl">74HC595 — DIP-16, vista superior</text>

  <path class="w" stroke="#5C666E" d="M 550 120 V 62 H 170 V 198"/>
  <path class="w" stroke="#5C666E" d="M 170 212 V 378 H 285 V 330"/>
  <circle cx="285" cy="330" r="3.5" fill="#5C666E"/>
  <line x1="148" y1="198" x2="192" y2="198" stroke="#5C666E" stroke-width="2.5"/>
  <line x1="148" y1="212" x2="192" y2="212" stroke="#5C666E" stroke-width="2.5"/>
  <text x="140" y="201" class="lbl2" text-anchor="end">0.1 &#181;F</text>
  <text x="140" y="217" class="lbl2" text-anchor="end">cer&#225;mico</text>

  <line x1="270" y1="120" x2="300" y2="120" stroke="#16191C" stroke-width="2"/><line x1="520" y1="120" x2="550" y2="120" stroke="#16191C" stroke-width="2"/><line x1="270" y1="150" x2="300" y2="150" stroke="#16191C" stroke-width="2"/><line x1="520" y1="150" x2="550" y2="150" stroke="#16191C" stroke-width="2"/><line x1="270" y1="180" x2="300" y2="180" stroke="#16191C" stroke-width="2"/><line x1="520" y1="180" x2="550" y2="180" stroke="#16191C" stroke-width="2"/><line x1="270" y1="210" x2="300" y2="210" stroke="#16191C" stroke-width="2"/><line x1="520" y1="210" x2="550" y2="210" stroke="#16191C" stroke-width="2"/><line x1="270" y1="240" x2="300" y2="240" stroke="#16191C" stroke-width="2"/><line x1="520" y1="240" x2="550" y2="240" stroke="#16191C" stroke-width="2"/><line x1="270" y1="270" x2="300" y2="270" stroke="#16191C" stroke-width="2"/><line x1="520" y1="270" x2="550" y2="270" stroke="#16191C" stroke-width="2"/><line x1="270" y1="300" x2="300" y2="300" stroke="#16191C" stroke-width="2"/><line x1="520" y1="300" x2="550" y2="300" stroke="#16191C" stroke-width="2"/><line x1="270" y1="330" x2="300" y2="330" stroke="#16191C" stroke-width="2"/><line x1="520" y1="330" x2="550" y2="330" stroke="#16191C" stroke-width="2"/>

  <rect x="300" y="90" width="220" height="270" rx="3" fill="#FFFFFF" stroke="#16191C" stroke-width="1.5"/>
  <path d="M 396 90 A 14 14 0 0 0 424 90" fill="#FBFBF9" stroke="#16191C" stroke-width="1.5"/>
  <circle cx="320" cy="110" r="4" fill="#5C666E"/>
  <text x="334" y="114" class="lbl2">pin 1</text>
  <text x="410" y="220" class="chip" text-anchor="middle">74HC595</text>

  <text x="260" y="124" class="lbl" text-anchor="end">1  QB</text>
  <text x="260" y="154" class="lbl" text-anchor="end">2  QC</text>
  <text x="260" y="184" class="lbl" text-anchor="end">3  QD</text>
  <text x="260" y="214" class="lbl" text-anchor="end">4  QE</text>
  <text x="260" y="244" class="lbl" text-anchor="end">5  QF</text>
  <text x="260" y="274" class="lbl" text-anchor="end">6  QG</text>
  <text x="260" y="304" class="lbl" text-anchor="end">7  QH</text>
  <text x="260" y="334" class="lbl" text-anchor="end">8  GND</text>

  <text x="560" y="124" class="lbl">16 VCC</text>
  <text x="560" y="154" class="lbl">15 QA</text>
  <text x="560" y="184" class="lbl">14 SER</text>
  <text x="560" y="214" class="lbl">13 OE</text>
  <text x="560" y="244" class="lbl">12 RCLK</text>
  <text x="560" y="274" class="lbl">11 SRCLK</text>
  <text x="560" y="304" class="lbl">10 SRCLR</text>
  <text x="560" y="334" class="lbl">9  QH&#8242;</text>

  <text x="700" y="394" class="lbl2" text-anchor="end">QA es el pin 15, no el 1 &#8212; es el error de cableado m&#225;s com&#250;n</text>
</svg>
