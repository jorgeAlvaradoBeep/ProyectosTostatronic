<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" width="860" height="380" role="img" aria-label="Dos 74HC595 en cascada compartiendo SRCLK y RCLK" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .lbl  { font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #16191C; }
    .lbl2 { font: 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #5C666E; }
    .wl   { font: 500 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .chip { font: 600 12.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #16191C; }
    .ttl  { font: 600 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #16191C; }
    .w    { fill: none; stroke-width: 2; stroke-linecap: square; }
  </style>

  <rect x="0" y="0" width="860" height="380" fill="#FBFBF9"/>
  <text x="20" y="28" class="ttl">Cascada — de 8 a 16 LEDs con los mismos 3 GPIO</text>
  <defs>
    <marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2668BE"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0E7F63"/>
    </marker>
  </defs>

  <path class="w" stroke="#0E7F63" d="M 85 230 V 305 H 600"/>
  <path class="w" stroke="#0E7F63" d="M 320 305 V 256" marker-end="url(#ab)"/>
  <path class="w" stroke="#0E7F63" d="M 600 305 V 256" marker-end="url(#ab)"/>
  <circle cx="320" cy="305" r="3.5" fill="#0E7F63"/>
  <text x="345" y="330" class="wl" fill="#0E7F63">SRCLK + RCLK — compartidos entre los dos chips</text>

  <path class="w" stroke="#2668BE" d="M 140 150 H 234" marker-end="url(#as)"/>
  <text x="187" y="140" class="wl" fill="#2668BE" text-anchor="middle">SER</text>
  <path class="w" stroke="#2668BE" d="M 400 150 H 514" marker-end="url(#as)"/>
  <text x="460" y="138" class="wl" fill="#2668BE" text-anchor="middle">QH&#8242; &#8594; SER</text>
  <text x="392" y="178" class="lbl2" text-anchor="end">9 QH&#8242;</text>
  <text x="528" y="178" class="lbl2">14 SER</text>
  <text x="430" y="72" class="lbl2">el bit que se desborda del primer registro</text>
  <text x="430" y="88" class="lbl2">entra al segundo &#8212; un solo cable</text>

  <rect x="30" y="120" width="110" height="110" rx="7" fill="#FFFFFF" stroke="#16191C" stroke-width="1.5"/>
  <text x="85" y="170" class="chip" text-anchor="middle">ESP32</text>
  <text x="85" y="188" class="lbl2" text-anchor="middle">3 GPIO</text>

  <rect x="240" y="100" width="160" height="155" rx="4" fill="#FFFFFF" stroke="#16191C" stroke-width="1.5"/>
  <text x="320" y="210" class="chip" text-anchor="middle">74HC595 #1</text>
  <text x="320" y="230" class="lbl2" text-anchor="middle">LEDs 1&#8211;8</text>

  <rect x="520" y="100" width="160" height="155" rx="4" fill="#FFFFFF" stroke="#16191C" stroke-width="1.5"/>
  <text x="600" y="210" class="chip" text-anchor="middle">74HC595 #2</text>
  <text x="600" y="230" class="lbl2" text-anchor="middle">LEDs 9&#8211;16</text>

  <text x="710" y="156" class="lbl2">y sigue: #3, #4&#8230;</text>
  <text x="710" y="176" class="lbl2">siempre 3 GPIO</text>
</svg>
