<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 540" width="860" height="540" role="img" aria-label="Esquematico de conexion entre ESP32-S3 y 74HC595 con ocho LEDs" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .lbl  { font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #16191C; }
    .lbl2 { font: 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #5C666E; }
    .wl   { font: 500 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .chip { font: 600 12.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #16191C; }
    .ttl  { font: 600 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #16191C; }
    .w    { fill: none; stroke-width: 2; stroke-linecap: square; }
  </style>

  <rect x="0" y="0" width="860" height="540" fill="#FBFBF9"/>
  <text x="20" y="28" class="ttl">ESP32-S3 + 74HC595 — 8 LEDs con 3 GPIO</text>
  <text x="20" y="46" class="lbl2">Tostatronic · tostatronic.com</text>

  <!-- riel 3.3 V -->
  <path class="w" stroke="#C5391F" d="M 200 190 H 255 V 64 H 790 V 401"/>
  <path class="w" stroke="#C5391F" d="M 310 64 V 135 H 400"/>
  <path class="w" stroke="#C5391F" d="M 352 64 V 165 H 400"/>
  <circle cx="310" cy="64" r="3.5" fill="#C5391F"/>
  <circle cx="352" cy="64" r="3.5" fill="#C5391F"/>
  <text x="268" y="56" class="wl" fill="#C5391F">3.3 V</text>

  <!-- GND -->
  <path class="w" stroke="#6B7780" d="M 200 330 H 270 V 460 H 380 V 405 H 400"/>
  <path class="w" stroke="#6B7780" d="M 350 460 V 370 H 400"/>
  <circle cx="350" cy="460" r="3.5" fill="#6B7780"/>
  <text x="290" y="452" class="wl" fill="#6B7780">GND</text>

  <!-- senales -->
  <path class="w" stroke="#2668BE"   d="M 200 225 H 400"/>
  <path class="w" stroke="#0E7F63" d="M 200 260 H 400"/>
  <path class="w" stroke="#B85C0A"  d="M 200 295 H 400"/>
  <text x="300" y="217" class="wl" fill="#2668BE"   text-anchor="middle">SER</text>
  <text x="300" y="252" class="wl" fill="#0E7F63" text-anchor="middle">SRCLK</text>
  <text x="300" y="287" class="wl" fill="#B85C0A"  text-anchor="middle">RCLK</text>

  <!-- placa -->
  <rect x="50" y="110" width="150" height="290" rx="7" fill="#FFFFFF" stroke="#16191C" stroke-width="1.5"/>
  <text x="125" y="142" class="chip" text-anchor="middle">ESP32-S3</text>
  <text x="125" y="160" class="lbl2" text-anchor="middle">SPI2 / FSPI</text>
  <text x="192" y="194" class="lbl" text-anchor="end">3V3</text>
  <text x="192" y="229" class="lbl" text-anchor="end">GPIO 11</text>
  <text x="192" y="264" class="lbl" text-anchor="end">GPIO 12</text>
  <text x="192" y="299" class="lbl" text-anchor="end">GPIO 10</text>
  <text x="192" y="334" class="lbl" text-anchor="end">GND</text>

  <!-- 74HC595 -->
  <rect x="400" y="105" width="180" height="335" rx="4" fill="#FFFFFF" stroke="#16191C" stroke-width="1.5"/>
  <text x="490" y="98" class="chip" text-anchor="middle">74HC595 &#183; VCC 3.3 V</text>
  <text x="408" y="139" class="lbl">16 VCC</text>
  <text x="408" y="169" class="lbl">10 SRCLR</text>
  <text x="408" y="229" class="lbl">14 SER</text>
  <text x="408" y="264" class="lbl">11 SRCLK</text>
  <text x="408" y="299" class="lbl">12 RCLK</text>
  <text x="408" y="374" class="lbl">13 OE</text>
  <text x="408" y="409" class="lbl">8 GND</text>
  <text x="572" y="139" class="lbl" text-anchor="end">QA 15</text>
  <text x="572" y="177" class="lbl" text-anchor="end">QB 1</text>
  <text x="572" y="215" class="lbl" text-anchor="end">QC 2</text>
  <text x="572" y="253" class="lbl" text-anchor="end">QD 3</text>
  <text x="572" y="291" class="lbl" text-anchor="end">QE 4</text>
  <text x="572" y="329" class="lbl" text-anchor="end">QF 5</text>
  <text x="572" y="367" class="lbl" text-anchor="end">QG 6</text>
  <text x="572" y="405" class="lbl" text-anchor="end">QH 7</text>

  <path class="w" stroke="#D24A3F" d="M 580 135 H 612 M 652 135 H 690 M 712 135 H 790"/>
  <rect x="612" y="128" width="40" height="14" fill="#FFFFFF" stroke="#16191C" stroke-width="1.5"/>
  <polygon points="712,124 712,146 690,135" fill="#D24A3F"/>
  <line x1="690" y1="122" x2="690" y2="148" stroke="#D24A3F" stroke-width="2.5"/>
  <circle cx="790" cy="135" r="3.5" fill="#C5391F"/>
  <path class="w" stroke="#D24A3F" d="M 580 173 H 612 M 652 173 H 690 M 712 173 H 790"/>
  <rect x="612" y="166" width="40" height="14" fill="#FFFFFF" stroke="#16191C" stroke-width="1.5"/>
  <polygon points="712,162 712,184 690,173" fill="#D24A3F"/>
  <line x1="690" y1="160" x2="690" y2="186" stroke="#D24A3F" stroke-width="2.5"/>
  <circle cx="790" cy="173" r="3.5" fill="#C5391F"/>
  <path class="w" stroke="#D24A3F" d="M 580 211 H 612 M 652 211 H 690 M 712 211 H 790"/>
  <rect x="612" y="204" width="40" height="14" fill="#FFFFFF" stroke="#16191C" stroke-width="1.5"/>
  <polygon points="712,200 712,222 690,211" fill="#D24A3F"/>
  <line x1="690" y1="198" x2="690" y2="224" stroke="#D24A3F" stroke-width="2.5"/>
  <circle cx="790" cy="211" r="3.5" fill="#C5391F"/>
  <path class="w" stroke="#D24A3F" d="M 580 249 H 612 M 652 249 H 690 M 712 249 H 790"/>
  <rect x="612" y="242" width="40" height="14" fill="#FFFFFF" stroke="#16191C" stroke-width="1.5"/>
  <polygon points="712,238 712,260 690,249" fill="#D24A3F"/>
  <line x1="690" y1="236" x2="690" y2="262" stroke="#D24A3F" stroke-width="2.5"/>
  <circle cx="790" cy="249" r="3.5" fill="#C5391F"/>
  <path class="w" stroke="#D24A3F" d="M 580 287 H 612 M 652 287 H 690 M 712 287 H 790"/>
  <rect x="612" y="280" width="40" height="14" fill="#FFFFFF" stroke="#16191C" stroke-width="1.5"/>
  <polygon points="712,276 712,298 690,287" fill="#D24A3F"/>
  <line x1="690" y1="274" x2="690" y2="300" stroke="#D24A3F" stroke-width="2.5"/>
  <circle cx="790" cy="287" r="3.5" fill="#C5391F"/>
  <path class="w" stroke="#D24A3F" d="M 580 325 H 612 M 652 325 H 690 M 712 325 H 790"/>
  <rect x="612" y="318" width="40" height="14" fill="#FFFFFF" stroke="#16191C" stroke-width="1.5"/>
  <polygon points="712,314 712,336 690,325" fill="#D24A3F"/>
  <line x1="690" y1="312" x2="690" y2="338" stroke="#D24A3F" stroke-width="2.5"/>
  <circle cx="790" cy="325" r="3.5" fill="#C5391F"/>
  <path class="w" stroke="#D24A3F" d="M 580 363 H 612 M 652 363 H 690 M 712 363 H 790"/>
  <rect x="612" y="356" width="40" height="14" fill="#FFFFFF" stroke="#16191C" stroke-width="1.5"/>
  <polygon points="712,352 712,374 690,363" fill="#D24A3F"/>
  <line x1="690" y1="350" x2="690" y2="376" stroke="#D24A3F" stroke-width="2.5"/>
  <circle cx="790" cy="363" r="3.5" fill="#C5391F"/>
  <path class="w" stroke="#D24A3F" d="M 580 401 H 612 M 652 401 H 690 M 712 401 H 790"/>
  <rect x="612" y="394" width="40" height="14" fill="#FFFFFF" stroke="#16191C" stroke-width="1.5"/>
  <polygon points="712,390 712,412 690,401" fill="#D24A3F"/>
  <line x1="690" y1="388" x2="690" y2="414" stroke="#D24A3F" stroke-width="2.5"/>
  <circle cx="790" cy="401" r="3.5" fill="#C5391F"/>

  <text x="632" y="118" class="lbl2" text-anchor="middle">220 &#937; &#215;8</text>
  <text x="812" y="240" class="lbl2" text-anchor="middle" transform="rotate(90 812 240)">&#225;nodos comunes &#183; 3.3 V</text>

  <path d="M 490 440 V 470" stroke="#5C666E" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>
  <text x="490" y="488" class="lbl2" text-anchor="middle">+ capacitor 0.1 &#181;F cer&#225;mico entre pin 16 y pin 8</text>
  <text x="490" y="506" class="lbl2" text-anchor="middle">LED enciende cuando la salida Qx va en BAJO (modo sumidero)</text>
</svg>
