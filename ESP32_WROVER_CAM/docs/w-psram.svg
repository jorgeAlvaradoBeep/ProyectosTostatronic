</style><defs><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4BA8F5"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2DD4A7"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#FF5C38"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#93A1AA"/></marker></defs><rect width="1200" height="800" fill="#101519"/><text x="60" y="60" class="s" fill="#93A1AA">Un cuadro de imagen a resolución completa</text><text x="60" y="100" class="s" fill="#93A1AA">(UXGA 1600 × 1200 en RGB565) pesa:</text><text x="60" y="200" class="m" fill="#F3F6F4">RAM interna del ESP32</text><rect x="60" y="220" width="95" height="52" rx="6" fill="#FF5C38"/><text x="177" y="260" class="big" fill="#FF5C38">520 KB</text><text x="370" y="258" class="s" fill="#93A1AA">no alcanza</text><text x="60" y="370" class="m" fill="#F3F6F4">Lo que pesa el cuadro</text><rect x="60" y="390" width="706" height="52" rx="6" fill="#F0B429"/><text x="788" y="430" class="big" fill="#F0B429">3.8 MB</text><text x="60" y="540" class="m" fill="#F3F6F4">PSRAM de esta placa</text><rect x="60" y="560" width="736" height="52" rx="6" fill="#2DD4A7"/><text x="818" y="600" class="big" fill="#2DD4A7">4 MB</text><rect x="60" y="640" width="1080" height="115" rx="12" fill="#1A222A" stroke="#2DD4A7" stroke-width="2"/><text x="100" y="692" class="m" fill="#2DD4A7">Por eso la PSRAM no es un extra</text><text x="100" y="730" class="s" fill="#93A1AA">Sin ella te quedas en resoluciones bajas. Con ella usas todo el sensor.</text></svg>